<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">Habesha Eatery serves authentic Ethiopian flavors, fresh inje
    <meta name="description" content="ra, and warm hospitality in a welcoming dining experience.">
    <title>Habesha eatery </title>
    link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo"><strong>Habesha Eatery</strong></div>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#reservation">Reserve</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#location">Location</a></li>
            </ul>
        </nav>
    </header>
<main class="container" id="home"
<h1>Authentic Ethiopian Dining</h1>
        <img
            src="./assets/habesha-hero.jpg"
            alt="A warm plate of traditional Ethiopian food served on injera with colorful side dishes"

            <section id="reservation" aria-labelledby="reservation-title">
            <h2 id="reservation-title">Reserve Your Table</h2>
            <action action="#" method="post">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div>
                    <label for="tel">Telephone</label>
                    <input
                        type="tel"
                        id="tel"
                        name="tel"
                        pattern="09[0-9]{8}"
                        placeholder="09xxxxxxxx"
                        required>
                
</div>
</action>
</section>               
</body>
</html>
