<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethiopia Weather — Live weather across Ethiopia</title>
    <meta name="description" content="Live weather across Ethiopia — current conditions, hourly and 5-day forecasts for Ethiopian cities." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme
      (function () {
        try {
          if ((localStorage.getItem("ew_theme") || "light") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
              <path d="M12 2v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M20 12h2"/><path d="M19.07 4.93l-1.41 1.41"/><path d="M15.95 12.65a4 4 0 0 0-5.93-4.57"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>
            </svg>
          </span>
          <div class="brand-text">
            <h1>Ethiopia Weather</h1>
            <p class="subtitle">Live weather across Ethiopia</p>
          </div>
        </div>

        <form class="search-bar" id="searchForm" role="search">
          <span class="search-field">
            <span class="search-field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </span>
            <input class="search-input" id="searchInput" type="text" placeholder="Search a city..." aria-label="Search a city" autocomplete="off" />
          </span>
          <button class="btn btn-primary" type="submit">Search</button>
          <button class="btn btn-ghost" id="locationBtn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            My Location
          </button>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
            <span class="theme-icon theme-icon-sun"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></span>
            <span class="theme-icon theme-icon-moon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
          </button>
        </form>
      </div>

      <p class="search-error" id="searchError" role="alert" aria-live="polite"></p>

      <nav class="city-chips" id="cityChips" aria-label="Ethiopian cities"></nav>
    </header>

    <main class="container">
      <!-- Loading state -->
      <section class="state-box loading-box" id="loadingState" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading weather…</p>
      </section>

      <!-- Error state -->
      <section class="state-box error-box glass" id="errorState" hidden>
        <p id="errorMessage">Unable to load weather data.</p>
        <button class="btn btn-primary" id="retryBtn" type="button">Try Again</button>
      </section>

      <!-- Dashboard -->
      <div id="dashboard" hidden>
        <section class="hero-card glass" id="heroCard" aria-label="Current weather"></section>

        <h2 class="section-title">Details</h2>
        <section class="details-grid" id="detailsGrid" aria-label="Weather details"></section>

        <h2 class="section-title">Hourly Forecast</h2>
        <section class="hourly-scroll" id="hourlyForecast" aria-label="Hourly forecast"></section>
        <div class="trend-wrap" id="trendWrap" aria-label="Hourly temperature trend"></div>

        <div class="lower-grid">
          <section class="lower-col" aria-label="5-day forecast">
            <h2 class="section-title">5-Day Forecast</h2>
            <section class="forecast-grid" id="forecastGrid" aria-label="5-day forecast"></section>
          </section>
          <section class="lower-col" aria-label="Weather in other Ethiopian cities">
            <h2 class="section-title">Weather Across Ethiopia</h2>
            <section class="other-cities-grid" id="otherCities" aria-label="Weather in other Ethiopian cities"></section>
          </section>
          <section class="lower-col" aria-label="Favorite cities">
            <h2 class="section-title">Favorite Cities</h2>
            <div class="chip-list" id="favoritesList"></div>
          </section>
          <section class="lower-col" aria-label="Recent searches">
            <h2 class="section-title">Recent Searches</h2>
            <div class="chip-list" id="recentList"></div>
          </section>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      Ethiopia Weather Dashboard • Built with HTML, CSS &amp; JavaScript • Data by Open-Meteo
    </footer>

    <script src="app.js"></script>
  </body>
</html>
