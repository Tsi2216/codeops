<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETB Currency Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>ETB Currency Converter</h1>

    <p id="status">Loading currency rates...</p>

    <form id="conversion-form">
      <label for="amount">Amount in ETB</label>

      <input
        type="number"
        id="amount"
        min="0"
        step="any"
        required
      >

      <label for="currency">Choose currency</label>

      <select id="currency" required>
        <option value="">Select a currency</option>
      </select>

      <button type="submit">Convert</button>

      <button type="button" id="add-watchlist">
        Add to Watchlist
      </button>
    </form>

    <p id="result"></p>

    <section>
      <h2>Watchlist</h2>
      <ul id="watchlist"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
