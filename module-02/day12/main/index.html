
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first html document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo"><strong>Logo</strong></div>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>

    <main class="container">

        <img src="./images/OIP.jpg" alt="Sample image">

    <section class="form-card">
        <h2>Contact Form</h2>
        <form action="#" method="post">
            <label for="fname">Full Name:</label>
            <input type="text" id="fname" name="fname">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">

            <input type="checkbox" id="che" name="che">

            <label for="departments">Department:</label>
            <select name="department" id="departments">
                <option value="cybersecurity">cybersecurity</option>
                <option value="software engineering">software engineering</option>
            </select>
        </form>
        <button type="submit">Submit</button>
    </section>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/Zj-pBm6mReM?si=HpyKc_AL1a7AxY-r" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <table>
        <thead>
            <tr>
                <th>Name</th>

                <th>Department</th>

        </thead>
